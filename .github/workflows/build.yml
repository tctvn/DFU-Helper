name: Build and Release

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Build Executable
      shell: cmd
      run: |
        build.bat

    - name: Generate Hash
      run: |
        (Get-FileHash -Algorithm SHA256 dfu_helper.exe).Hash | Out-File -Encoding ASCII hash.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: Latest Release
        files: |
          dfu_helper.exe
          hash.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
